<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#0f172a"/>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Decorative line chart -->
  <polyline points="80,300 180,200 280,240 380,140 480,190 580,120 680,160"
            fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/>
  <polyline points="80,320 180,260 280,280 380,200 480,240 580,180 680,220"
            fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.5"/>
  <!-- Dots -->
  <circle cx="380" cy="140" r="8" fill="#a855f7" opacity="0.7"/>
  <circle cx="580" cy="120" r="8" fill="#3b82f6" opacity="0.7"/>
  <!-- Label -->
  <text x="400" y="60" font-family="Inter,sans-serif" font-size="22" fill="#a855f7"
        text-anchor="middle" font-weight="700">Project Screenshot</text>
  <text x="400" y="90" font-family="Inter,sans-serif" font-size="14" fill="#64748b"
        text-anchor="middle">Replace src with your image path</text>
</svg>
